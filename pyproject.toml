[project]
name = "python-data-analysis"
version = "1.0.0"
description = "Python data analysis from NumPy to dashboards: tutorials and complete projects"
requires-python = "==3.13.*"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "plotly==5.24.1",
    "streamlit==1.67.0",
    "missingno==0.5.2",
    "scipy==1.15.3",
    "statsmodels==0.14.4",
    "jupyterlab==4.3.4",
]
